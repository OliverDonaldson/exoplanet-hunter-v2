<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The light curve: flat baseline, transit dip, flat baseline. The same
       motif the boot dial draws and the scoring loader animates.
       Drawn heavy on purpose. A curve at the stroke weight it wants visually
       disappears into a smudge at 16 px, which is the size a favicon is
       actually read at, so the line is thick and the dip is deep and square
       rather than faithful to a real ingress. -->
  <rect width="32" height="32" rx="7" fill="#050608"/>
  <path d="M3.5 12.5h6.2l1.9 7h8.8l1.9-7h6.2"
        fill="none" stroke="#4DFFD2" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
