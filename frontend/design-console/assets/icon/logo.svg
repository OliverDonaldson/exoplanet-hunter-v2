<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="mark mark-full" aria-hidden="true">
  <!-- The full grade of the mark from issue #62's concept sheet, for anywhere
       with the room to read it. The dashed circle is the acquisition reticle
       and the four ticks are its axes; the planet is a stroked disc rather
       than a solid one so the ring reads as passing behind it. Below about
       48 px this collapses — use favicon.svg, which is the same mark drawn
       for that size. -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(77,255,210,0.28)"
          stroke-width="1.4" stroke-dasharray="3 7"/>
  <circle cx="60" cy="60" r="19" fill="rgba(77,255,210,0.16)" stroke="#4DFFD2"
          stroke-width="1.8"/>
  <ellipse cx="60" cy="60" rx="36" ry="10" fill="none" stroke="#4DFFD2"
           stroke-width="1.8" transform="rotate(-20 60 60)"/>
  <g stroke="#4DFFD2" stroke-width="2.4">
    <line x1="60" y1="4" x2="60" y2="18"/>
    <line x1="60" y1="102" x2="60" y2="116"/>
    <line x1="4" y1="60" x2="18" y2="60"/>
    <line x1="102" y1="60" x2="116" y2="60"/>
  </g>
</svg>
