<style>
/* ═══════════════════════════════════════════════════════════
   EXOPLANET HUNTER — DESIGN SYSTEM
   Direction: Deep Space Cinematic
   Signature Color: Electric Teal #4DFFD2
   Fonts embedded: Anurati (wordmark + hero headlines) / Ailerons (UI) / Inter / JetBrains Mono
   ═══════════════════════════════════════════════════════════ */

@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:block;src:url(data:font/woff2;base64,__FONT_INTER__) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 800;font-display:block;src:url(data:font/woff2;base64,__FONT_JBM__) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Anurati';font-style:normal;font-weight:400;font-display:block;src:url(data:font/woff2;base64,__FONT_ANURATI__) format('woff2');}
@font-face{font-family:'Ailerons';font-style:normal;font-weight:400;font-display:block;src:url(data:font/woff2;base64,__FONT_AILERONS__) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}

:root{
  color-scheme: dark;
  --teal:#4DFFD2; --teal-dim:rgba(77,255,210,0.15); --teal-glow:rgba(77,255,210,0.25);
  --amber:#F5A623; --danger:#FF4D4D; --slate-muted:#8A8FA8;
  --space-black:#050608; --space-surface:#0A0C10; --space-elevated:#0F1117;
  --hairline:rgba(255,255,255,0.10);
}

*{box-sizing:border-box;}
/* `clip`, not `hidden`. The catalogue's orbital motif is positioned 100 px past
   its container on purpose, and on a viewport narrow enough that the page pad
   fills the width that bleed became 100 px of real horizontal scroll — body's
   overflow-x:hidden propagates to the viewport, which makes the viewport a
   scroll container rather than clipping the overflow. `clip` clips it, creates
   no scroll container, and leaves position:sticky working. */
html{scroll-behavior:smooth;overflow-x:clip;}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background-color:#050608;
  color:#F0EEE8;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:clip;
}
/* iOS Safari zooms the viewport in when a focused input's type is under 16 px,
   and does not zoom back out. The catalogue search was 12 px and the TIC field
   14.4 px, so typing a target on a phone left the page zoomed. Scoped to touch
   devices so the desktop type scale is untouched -- the bug is the zoom, not
   the size. */
@media (hover: none) and (pointer: coarse){
  input,textarea,select{font-size:16px !important;}
}

/* Touch targets. Measured on a 375 px viewport, these came in between 17 and
   32 px against the 44 px the guidelines ask for on touch: the filter chips at
   41x29, the menu button 42x32, the candidate shortcuts 95x28, the vetting tabs
   92x42, and the health panel's replay control worst at 18x17.

   The fix is a centred overlay rather than more padding, so the hit area grows
   and nothing moves. `max()` means a control already at or above 44 px is left
   alone. Applied only on touch, where the 44 px floor applies and where there
   is no cursor to aim with. The overlays stay narrower than the gaps between
   the controls they sit on, so none of them steals a neighbour's tap. */
@media (hover: none) and (pointer: coarse){
  #cat-disp button,#cat-src button,#nav-toggle,.cand-btn,#vet-tabs button,#hstat-replay{
    position:relative;
  }
  #cat-disp button::after,#cat-src button::after,#nav-toggle::after,
  .cand-btn::after,#vet-tabs button::after,#hstat-replay::after{
    content:'';position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:max(100%,44px);height:max(100%,44px);
  }
  /* A range input's hit area is its box, and a pseudo-element cannot carry the
     drag. Padding grows the box while the track stays the size it looks. */
  #cat-range{height:16px;padding:14px 0;box-sizing:content-box;}
}

/* Seven nav links stand between a keyboard user and the content on every page. */

  font-family:'JetBrains Mono',monospace;font-size:0.7rem;letter-spacing:0.12em;
  text-transform:uppercase;text-decoration:none;padding:0.75rem 1.25rem;margin:0.5rem;
  transition:transform 160ms ease;
}
.skip-link:focus{transform:translateY(0);}
@media(prefers-reduced-motion:reduce){ .skip-link{transition:none;} }

}
.btn-teal:hover{background:rgba(77,255,210,0.08);border-color:#4DFFD2;box-shadow:0 0 24px rgba(77,255,210,0.2),inset 0 0 24px rgba(77,255,210,0.05);}

.text-teal{color:#4DFFD2;} .text-amber{color:#F5A623;} .text-danger{color:#FF4D4D;} .text-muted-space{color:#8A8FA8;}

.prob-high{color:#4DFFD2;background:rgba(77,255,210,0.1);border:1px solid rgba(77,255,210,0.3);font-family:'JetBrains Mono',monospace;font-size:0.7rem;padding:0.15rem 0.5rem;border-radius:2px;}

#star-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:0.7;}

.ticker-track:hover{animation-play-state:paused;}

.data-row{transition:background 150ms ease;border-bottom:1px solid rgba(255,255,255,0.06);}
.data-row:hover{background:rgba(77,255,210,0.04);cursor:pointer;}

/* The seven nav links and the two mission tags are back on Ailerons. The sizes
   set with the Anurati change stay: they were a legibility fix, and Ailerons
   reads better at them too. The wordmark keeps Anurati. */
.nav-link{font-family:'Ailerons',sans-serif;font-size:0.84rem;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:rgba(240,238,232,0.6);transition:color 200ms ease;text-decoration:none;}
.nav-link:hover,.nav-link.active{color:#F0EEE8;}

/* Upload progress rail. While the run is held on the MAST stage the fill stops
   where it is and a stripe travels over it: there is no measured progress to
   show, and a bar that keeps creeping would be inventing one. */
.up-rail{height:2px;background:rgba(255,255,255,0.08);position:relative;overflow:hidden;}
.up-fill{height:100%;background:#4DFFD2;transition:width 400ms linear;box-shadow:0 0 8px rgba(77,255,210,0.6);}
.up-rail.waiting::after{
  content:'';position:absolute;inset:0;width:38%;
  background:linear-gradient(90deg,transparent,rgba(77,255,210,0.75),transparent);
  animation:up-sweep 1.4s linear infinite;
}
@keyframes up-sweep{from{transform:translateX(-100%);}to{transform:translateX(363%);}}
@media(prefers-reduced-motion:reduce){.up-rail.waiting::after{animation:none;opacity:0.4;}}

/* Vetting pipeline timeline: a rail down the left with a node per stage. */
.pipe{position:relative;padding-left:2.25rem;}
.pipe::before{content:'';position:absolute;left:0.53rem;top:0.4rem;bottom:0.4rem;width:1px;background:rgba(255,255,255,0.10);}
.pipe-step{position:relative;padding-bottom:2rem;}
.pipe-step:last-child{padding-bottom:0;}
.pipe-step::before{
  content:'';position:absolute;left:-1.97rem;top:0.3rem;width:9px;height:9px;border-radius:50%;
  background:#050608;border:1px solid #4DFFD2;box-shadow:0 0 8px rgba(77,255,210,0.45);
}
.pipe-step.absent::before{border-color:rgba(138,143,168,0.6);box-shadow:none;}
.pipe-step .n{font-family:'JetBrains Mono',monospace;font-size:0.58rem;letter-spacing:0.14em;color:#4DFFD2;}
.pipe-step.absent .n{color:#8A8FA8;}
.pipe-step h4{font-family:'Ailerons',sans-serif;font-size:0.9rem;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;color:#F0EEE8;margin:0.2rem 0 0.45rem;}
.pipe-step .what{font-family:'Inter',sans-serif;font-size:0.78rem;line-height:1.6;color:rgba(240,238,232,0.55);margin-bottom:0.7rem;max-width:62ch;}
.pipe-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:1px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.07);}
.pipe-out > div{background:#050608;padding:0.7rem 0.85rem;}
.pipe-out .k{font-family:'Ailerons',sans-serif;font-size:0.6rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#8A8FA8;margin-bottom:0.3rem;}
.pipe-out .v{font-family:'JetBrains Mono',monospace;font-size:0.82rem;color:#F0EEE8;font-variant-numeric:tabular-nums;}
.pipe-out .v.dim{color:#8A8FA8;font-size:0.7rem;}
@media(max-width:820px){ .pipe{padding-left:1.6rem;} .pipe-step::before{left:-1.4rem;} }

.chart-tooltip{background:rgba(10,12,16,0.95);border:1px solid rgba(77,255,210,0.3);padding:0.5rem 0.75rem;font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:#F0EEE8;backdrop-filter:blur(8px);}

.upload-zone{border:1px dashed rgba(77,255,210,0.3);background:rgba(77,255,210,0.02);transition:background-color 250ms ease,border-color 250ms ease;}
.upload-zone:hover,.upload-zone.drag-over{border-color:rgba(77,255,210,0.6);background:rgba(77,255,210,0.05);box-shadow:0 0 30px rgba(77,255,210,0.1);}

/* Mission backdrop, cropped and lifted at build time by tools/backdrop.py.

   It replaces a canvas that drew 900 procedural stars every resize, and whose
   own comment called it a stand-in for a hero photograph that never arrived.

   The contrast the headline needs is bought entirely by the gradient below,
   over the left third where the type sits. The right two thirds are left at
   full strength, because that is where the frame is worth looking at and
   nothing is written on it.

   `background-attachment` is deliberately not `fixed`: it thrashes on iOS and
   is one of the reliable ways to make a page scroll badly on a phone. */
.hero-sky{
  position:absolute;inset:0;pointer-events:none;
  background-image:url(data:image/webp;base64,__BG_ORION__);
  background-size:cover;background-position:38% 42%;
  opacity:0.9;
}
/* Measured, not judged by eye: against the brightest backdrop pixel under each
   block this holds the headline at 10.9:1 and the muted body copy at 4.5:1.
   The left stop is the number that matters; the rest is free to open up. */
.hero-sky::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(5,6,8,0.84) 0%,rgba(5,6,8,0.50) 34%,rgba(5,6,8,0.06) 62%,rgba(5,6,8,0.18) 100%);
}
/* The ramp above protects the left third, which is where the copy sits on a
   wide screen. Below the stacking breakpoint the copy spans the full width
   instead, and the same ramp left the paragraph on 2.02:1. A flat vertical
   scrim covers it at 5.2:1, at the cost of the frame being evenly dimmed --
   the right trade on a screen with no room to put the type beside the image. */
@media(max-width:820px){
  .hero-sky::after{
    background:linear-gradient(180deg,rgba(5,6,8,0.80) 0%,rgba(5,6,8,0.70) 55%,rgba(5,6,8,0.24) 100%);
  }
}

.hero-credit{
  position:absolute;left:3rem;bottom:3.25rem;z-index:2;
  font-family:'JetBrains Mono',monospace;font-size:0.54rem;letter-spacing:0.1em;
  text-transform:uppercase;color:rgba(138,143,168,0.42);
}
.hero-credit a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(138,143,168,0.22);}
.hero-credit a:hover,.hero-credit a:focus-visible{color:rgba(240,238,232,0.75);}
@media(max-width:820px){
  /* The hero centres its content in 100vh, so on a short, narrow viewport the
     block is taller than the space and the top of it runs up under the fixed
     nav -- at 375x812 the eyebrow sat beneath the bar and behind the menu
     button. Reserving the bar's height as padding centres the content in what
     is actually free. */
  .hero{padding-top:56px;box-sizing:border-box;}
  /* The status panel goes full width down here and the credit at 3.25rem
     landed inside it. Anchoring to the section's bottom instead put it past the
     fold, because the section runs taller than the viewport once the nav's
     height is reserved. So on narrow screens it leaves the corner entirely and
     sits in flow under the panel, which cannot collide with anything. */
  .hero-credit{position:static;margin:0.9rem 1.5rem 0;}
}
@media(max-width:640px){ .hero-credit{font-size:0.5rem;letter-spacing:0.06em;max-width:calc(100% - 3rem);} }

.orbital-motif{position:absolute;top:50%;right:-200px;transform:translateY(-50%);width:600px;height:600px;border-radius:50%;border:1px solid rgba(255,255,255,0.03);pointer-events:none;}
.orbital-motif::before{content:'';position:absolute;top:50px;left:50px;right:50px;bottom:50px;border-radius:50%;border:1px solid rgba(77,255,210,0.04);}
.orbital-motif::after{content:'';position:absolute;top:120px;left:120px;right:120px;bottom:120px;border-radius:50%;border:1px solid rgba(255,255,255,0.025);}

.rv{opacity:0;}
.crumb:hover{color:#F0EEE8!important;}
.cand-btn:hover{color:#4DFFD2!important;border-color:rgba(77,255,210,0.3)!important;}

/* ── page chrome ──────────────────────────────────────────── */
#nav{
  position:fixed;top:0;left:0;right:0;z-index:100;height:56px;display:flex;align-items:center;
  transition:background 300ms ease,border-color 300ms ease;
  background:transparent;border-bottom:1px solid transparent;
}
#nav.scrolled{background:rgba(5,6,8,0.92);border-bottom:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(12px);}
#nav .container{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:100%;padding:0 2rem;}
#nav .mission-tags{display:flex;gap:1.5rem;align-items:center;flex:0 0 auto;white-space:nowrap;}
#nav .mission-tags .stat-label{font-family:'Ailerons',sans-serif;font-size:0.72rem;letter-spacing:0.16em;}
#nav .wordmark{display:flex;align-items:center;gap:0.6rem;flex:0 0 auto;}
#nav .wordmark span{font-family:'Anurati',sans-serif;font-size:0.92rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#F0EEE8;white-space:nowrap;}
#nav nav{display:flex;gap:2rem;align-items:center;}
#nav .nav-link{position:relative;}
#nav .nav-link.active::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:1px;background:#4DFFD2;}

/* Menu button. Hidden above the collapse breakpoint, where the seven links sit
   on the bar; below it the links move into the panel and this opens them. */
#nav-toggle{
  display:none;background:transparent;border:1px solid rgba(255,255,255,0.14);
  color:rgba(240,238,232,0.7);padding:0.45rem 0.55rem;line-height:0;flex:0 0 auto;
  transition:color 200ms ease,border-color 200ms ease;
}
#nav-toggle svg{width:22px;height:16px;display:block;}
#nav-toggle:hover,#nav-toggle[aria-expanded="true"]{color:#4DFFD2;border-color:rgba(77,255,210,0.45);}
#nav-scrim{position:fixed;inset:56px 0 0;background:rgba(5,6,8,0.6);z-index:-1;}

/* A score in flight, marked on the nav so leaving the Upload page to browse
   does not mean losing track of whether one is still running. */
body.scoring #nav .nav-link[href="#/upload"]::before{
  content:'';position:absolute;left:-0.75rem;top:50%;margin-top:-2.5px;
  width:5px;height:5px;border-radius:50%;background:#4DFFD2;
  box-shadow:0 0 6px rgba(77,255,210,0.8);animation:scoring-pulse 1.4s ease-in-out infinite;
}
@keyframes scoring-pulse{0%,100%{opacity:1;}50%{opacity:0.2;}}
@media(prefers-reduced-motion:reduce){ body.scoring #nav .nav-link[href="#/upload"]::before{animation:none;} }

#ticker{
  position:fixed;bottom:0;left:0;right:0;z-index:90;height:40px;display:flex;align-items:center;
  background:rgba(5,6,8,0.92);border-top:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(12px);overflow:hidden;
}

#ticker .tag span{font-family:'Ailerons',sans-serif;font-size:0.6rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#4DFFD2;white-space:nowrap;}
#ticker .feed{flex:1;overflow:hidden;}
#ticker .item{display:flex;align-items:center;gap:0.5rem;padding:0 1.75rem;font-family:'JetBrains Mono',monospace;font-size:0.65rem;white-space:nowrap;color:#8A8FA8;}
#ticker .item b{color:rgba(240,238,232,0.85);font-weight:400;}
#ticker .item i{font-style:normal;}

/* ── charts ───────────────────────────────────────────────── */
.chart-wrap{position:relative;}

/* ── inputs ───────────────────────────────────────────────── */
input[type="text"]{outline:none;transition:border-color 200ms ease;}

input[type="range"]{accent-color:#4DFFD2;}
select{outline:none;}
select option{background:#0A0C10;color:#F0EEE8;}

/* ── shared panel furniture ───────────────────────────────── */
.panel{border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.01);}
.tag-chip{
  font-family:'Ailerons',sans-serif;font-size:0.55rem;font-weight:600;letter-spacing:0.14em;
  text-transform:uppercase;padding:0.2rem 0.45rem;border-radius:2px;white-space:nowrap;
}
.tag-oof{color:#4DFFD2;background:rgba(77,255,210,0.10);border:1px solid rgba(77,255,210,0.30);}
.tag-zeroshot{color:#F5A623;background:rgba(245,166,35,0.10);border:1px solid rgba(245,166,35,0.35);}

.interval{position:relative;height:3px;background:rgba(255,255,255,0.07);margin-top:0.55rem;}
.interval span{position:absolute;top:0;bottom:0;background:rgba(77,255,210,0.45);}
.interval i{position:absolute;top:-2px;bottom:-2px;width:1px;background:#4DFFD2;}

/* ── branch evidence ──────────────────────────────────────── */
.branch-row{
  display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) 5rem;gap:1.5rem;align-items:start;
  padding:1rem 0;border-bottom:1px solid rgba(255,255,255,0.06);
}
.branch-row:last-child{border-bottom:none;}
.branch-key{font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:#F0EEE8;}
.branch-sees{font-family:'Inter',sans-serif;font-size:0.7rem;line-height:1.5;color:rgba(240,238,232,0.42);margin-top:0.25rem;}
.branch-bar{position:relative;height:10px;background:rgba(255,255,255,0.03);border-left:1px solid rgba(255,255,255,0.06);border-right:1px solid rgba(255,255,255,0.06);}
.branch-bar::after{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:rgba(255,255,255,0.22);}
.branch-fill{position:absolute;top:1px;bottom:1px;}
.branch-read{font-family:'Inter',sans-serif;font-size:0.78rem;line-height:1.5;color:rgba(240,238,232,0.75);margin-top:0.55rem;}
.branch-val{font-family:'JetBrains Mono',monospace;font-size:0.85rem;text-align:right;font-variant-numeric:tabular-nums;}
.branch-scale{
  display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) 5rem;gap:1.5rem;
  padding-bottom:0.75rem;border-bottom:1px solid rgba(255,255,255,0.08);
}
.branch-scale .ends{display:flex;justify-content:space-between;font-family:'Ailerons',sans-serif;font-size:0.58rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;}
@media(max-width:820px){
  .branch-row,.branch-scale{grid-template-columns:1fr 4.5rem;}
  .branch-row > .branch-mid{grid-column:1 / -1;}
  .branch-scale > .ends{grid-column:1 / -1;}
  .branch-scale > .scale-spacer{display:none;}
}

/* ── model agreement ──────────────────────────────────────── */
.fold-axis{position:relative;height:64px;margin:1.25rem 0 0.5rem;}
.fold-track{position:absolute;left:0;right:0;top:31px;height:1px;background:rgba(255,255,255,0.12);}
.fold-band{position:absolute;top:14px;height:36px;background:rgba(77,255,210,0.10);border-left:1px solid rgba(77,255,210,0.25);border-right:1px solid rgba(77,255,210,0.25);}
.fold-mean{position:absolute;top:6px;bottom:14px;width:1px;background:#4DFFD2;box-shadow:0 0 8px rgba(77,255,210,0.7);}
.fold-dot{position:absolute;top:25px;width:13px;height:13px;border-radius:50%;border:1px solid #4DFFD2;background:rgba(5,6,8,0.9);transform:translateX(-50%);}
.fold-tick{position:absolute;top:44px;font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:#8A8FA8;transform:translateX(-50%);}

/* ── diagnostics, three states ────────────────────────────── */
.diag-card{background:#050608;padding:1.5rem;display:flex;gap:1rem;align-items:flex-start;}
.diag-card.unmeasured{background:rgba(255,255,255,0.012);}
.diag-marker{width:9px;height:9px;border-radius:50%;margin-top:3px;flex-shrink:0;}
.diag-marker.pass{background:#4DFFD2;box-shadow:0 0 8px rgba(77,255,210,0.6);}
.diag-marker.fail{background:#FF4D4D;box-shadow:0 0 8px rgba(255,77,77,0.6);}
.diag-marker.unmeasured{background:transparent;border:1px dashed rgba(138,143,168,0.8);box-shadow:none;}
.diag-name{font-family:'Ailerons',sans-serif;font-size:0.8rem;font-weight:600;color:#F0EEE8;}
.diag-card.unmeasured .diag-name{color:rgba(240,238,232,0.45);}
.diag-field{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:rgba(138,143,168,0.65);margin-top:0.2rem;}
.diag-desc{font-family:'Inter',sans-serif;font-size:0.75rem;color:rgba(240,238,232,0.45);line-height:1.5;margin-top:0.5rem;}
.diag-card.unmeasured .diag-desc{color:rgba(138,143,168,0.55);font-style:italic;}

/* ── follow-up priority ───────────────────────────────────── */
.fu-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0;}
.fu-cell{padding:1.1rem 1.25rem;border-right:1px solid rgba(255,255,255,0.08);}
.fu-cell:last-child{border-right:none;}
@media(max-width:900px){
  .fu-grid{grid-template-columns:repeat(2,1fr);}
  .fu-cell{border-bottom:1px solid rgba(255,255,255,0.08);}
}

/* ── mission cards ────────────────────────────────────────── */
.mission-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:0;border:1px solid rgba(255,255,255,0.08);}
.mission-card{padding:1.5rem;border-right:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.01);}
.mission-card:last-child{border-right:none;}
@media(max-width:900px){.mission-card{border-right:none;border-bottom:1px solid rgba(255,255,255,0.08);}}

.seg{display:flex;border:1px solid rgba(255,255,255,0.1);width:max-content;max-width:100%;flex-wrap:wrap;}
.seg button{
  font-family:'Ailerons',sans-serif;font-size:0.62rem;font-weight:600;letter-spacing:0.12em;
  text-transform:uppercase;padding:0.55rem 1.1rem;background:transparent;border:none;
  border-right:1px solid rgba(255,255,255,0.1);color:#8A8FA8;transition:background-color 150ms ease,color 150ms ease,border-color 150ms ease;
}
.seg button:last-child{border-right:none;}
.seg button.on{background:rgba(77,255,210,0.08);color:#4DFFD2;}

.soon{border:1px dashed rgba(255,255,255,0.12);background:rgba(255,255,255,0.012);padding:2.5rem 1.75rem;text-align:center;}
.soon .h{font-family:'Ailerons',sans-serif;font-size:0.85rem;font-weight:600;color:rgba(240,238,232,0.55);margin-bottom:0.5rem;}
.soon .d{font-family:'Inter',sans-serif;font-size:0.78rem;line-height:1.6;color:#8A8FA8;max-width:52ch;margin:0 auto;}

.note{display:flex;gap:0.6rem;align-items:flex-start;padding:0.7rem 0.9rem;border:1px solid rgba(245,166,35,0.25);background:rgba(245,166,35,0.04);}
.note .ico{color:#F5A623;font-family:'JetBrains Mono',monospace;font-size:0.7rem;line-height:1.5;flex:none;}
.note .txt{font-family:'Inter',sans-serif;font-size:0.72rem;line-height:1.55;color:rgba(240,238,232,0.62);}

/* ═══════════════════════════════════════════════════════════
   SERVICE STATUS — /healthz, four states
   Browsing is never gated on a warm ensemble; only scoring is.
   ═══════════════════════════════════════════════════════════ */
#hstat{
  position:absolute;right:clamp(1.5rem,4vw,3rem);bottom:5.5rem;z-index:3;
  width:min(17.5rem,36vw);
  border:1px solid rgba(255,255,255,0.10);background:rgba(10,12,16,0.72);
  backdrop-filter:blur(10px);padding:0.8rem 0.9rem 0.75rem;
}
#hstat .row{display:flex;align-items:center;gap:0.5rem;}
#hstat .label{font-family:'Ailerons',sans-serif;font-size:0.55rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;flex:1;min-width:0;}
#hstat .detail{font-family:'JetBrains Mono',monospace;font-size:0.56rem;color:#8A8FA8;margin-top:0.35rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#hstat .foot{font-family:'Inter',sans-serif;font-size:0.6rem;line-height:1.45;color:rgba(240,238,232,0.42);margin-top:0.55rem;}
#hstat .replay{background:none;border:1px solid rgba(255,255,255,0.12);color:#8A8FA8;font-family:'JetBrains Mono',monospace;font-size:0.56rem;line-height:1;padding:0.2rem 0.34rem;transition:background-color 150ms ease,color 150ms ease,border-color 150ms ease;flex:none;}
#hstat .replay:hover{border-color:rgba(77,255,210,0.4);color:#4DFFD2;}
/* indeterminate: a travelling sliver, for the sub-2s and suspend-resume paths */
#hstat .rail{position:relative;height:2px;background:rgba(255,255,255,0.07);margin-top:0.6rem;overflow:hidden;}
#hstat .rail .sliver{position:absolute;top:0;bottom:0;width:34%;background:linear-gradient(90deg,transparent,#F5A623,transparent);}
/* determinate: only for the ~90s ensemble load, where a bar means something */
#hstat .rail .fill{position:absolute;top:0;bottom:0;left:0;width:0%;background:#F5A623;box-shadow:0 0 8px rgba(245,166,35,0.5);}
#hstat .rail.ready .fill{background:#4DFFD2;box-shadow:0 0 8px rgba(77,255,210,0.5);}
#hstat .eta{display:flex;justify-content:space-between;align-items:baseline;margin-top:0.35rem;font-family:'JetBrains Mono',monospace;font-size:0.54rem;color:#8A8FA8;font-variant-numeric:tabular-nums;}
#hstat .ring{width:11px;height:11px;flex:none;}
#hstat .ring circle{fill:none;stroke-width:2;}
@media(max-width:900px){
  #hstat{position:static;width:100%;max-width:26rem;margin-top:2.5rem;backdrop-filter:none;}
}

/* ── responsive fallbacks ─────────────────────────────────── */
@media(max-width:1100px){
  .hero-grid{grid-template-columns:1fr!important;}
  .hero-orbit{display:none!important;}
  .about-grid{grid-template-columns:1fr!important;gap:3rem!important;}
  .six-up{grid-template-columns:repeat(3,1fr)!important;}
  .charts-grid{grid-template-columns:1fr!important;}
  .cm-grid{grid-template-columns:1fr!important;}
}
@media(max-width:900px){ .hero-note{display:none!important;} }
/* Ailerons sets wider than the font the header breakpoints below were tuned
   against, so the wordmark collided with the nav well before those widths.
   These hide the two optional header elements earlier. Additive, so the
   blocks below keep owning the grid and padding changes. */
@media(max-width:1340px){ #nav .mission-tags{display:none;} }
@media(max-width:1150px){ #nav .wordmark{display:none;} }

/* Seven links in Ailerons need about 810 px of bar, and the wordmark is
   already hidden by 1150. Below 900 they stop fitting at any tracking worth
   reading, so they move into a panel behind the menu button. */
#nav-scrim{display:none;}
@media(max-width:900px){
  /* The wordmark and tags are already hidden by this width, so the button is
     the only thing left in the bar — pushed to the trailing edge, where a menu
     control is looked for, rather than left stranded at the start. */
  #nav-toggle{display:block;margin-left:auto;}
  #nav.menu-open #nav-scrim{display:block;}
  #nav nav{
    position:fixed;top:56px;left:0;right:0;
    flex-direction:column;align-items:stretch;gap:0;
    padding:0.25rem 1.5rem 0.75rem;
    background:rgba(5,6,8,0.97);border-bottom:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    max-height:calc(100vh - 56px);overflow-y:auto;
    opacity:0;transform:translateY(-8px);pointer-events:none;
    transition:opacity 180ms ease,transform 180ms ease;
  }
  #nav.menu-open nav{opacity:1;transform:translateY(0);pointer-events:auto;}
  #nav nav .nav-link{padding:0.95rem 0.15rem;border-bottom:1px solid rgba(255,255,255,0.06);}
  #nav nav .nav-link:last-child{border-bottom:none;}
  #nav nav .nav-link.active::after{bottom:0.55rem;right:auto;width:1.1rem;}
}
@media(prefers-reduced-motion:reduce){ #nav nav{transition:none;} }

@media(max-width:820px){
  #nav .mission-tags{display:none;}
  .page-pad{padding-left:1.5rem!important;padding-right:1.5rem!important;}
  .six-up{grid-template-columns:repeat(2,1fr)!important;}
  .diag-grid{grid-template-columns:1fr!important;}
  .fmt-grid{grid-template-columns:1fr!important;}
  .vet-head{grid-template-columns:1fr!important;}
  .vet-head .prob-big{text-align:left!important;align-items:flex-start!important;}
  /* The ticker is a horizontal marquee; at phone widths it shows two cells at a
     time and costs a fixed strip of the screen for them. Hidden, and the space
     every page reserves for it goes back. */
  #ticker{display:none;}
  #app.page-content > div{padding-bottom:0!important;}
  /* Cell padding is 1 rem a side, which on the catalogue is 270 px of the
     table's 1224 — more than a fifth of the width spent on gutters. Tightened
     here so the scale-to-fit spends its budget on columns instead. The type
     size is untouched; this is spacing, not content. */
  [data-fit-table] th,[data-fit-table] td{padding-left:0.4rem!important;padding-right:0.4rem!important;}
  /* 1180 is the width the catalogue needs at desktop gutters. With the gutters
     above it needs 940, and leaving the old floor in place would have had the
     scale-to-fit paying for 240 px of table that is no longer there. */
  [data-fit-table="catalogue"] table{min-width:940px!important;}
}
@media(max-width:640px){
  #nav .wordmark{display:none;}
  #nav .container{padding:0 1.25rem;}
}

/* ═══════════════════════════════════════════════════════════
   BOOT PRELOADER — instrument dial
   Structure follows the anime.js hero dial: glowing segmented
   outer ring, dense tick ring, glass disc, staggered drawn
   arcs. Palette stays ours.
   ═══════════════════════════════════════════════════════════ */
/* The meter is pinned to the bottom of the overlay while the dial and readout
   are centred in it, so on a short viewport the two ran into each other — 46 px
   of overlap at 1280x620, and only 3 px of clearance at 720. The padding
   reserves the meter's strip so the centring happens in what is left, and the
   dial takes a viewport-height cap so it gives way before the text does. */
#boot{
  position:fixed;inset:0;z-index:200;background:#050608;
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  padding-bottom:6rem;box-sizing:border-box;
}
#boot .boot-vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(77,255,210,0.055),transparent 58%);pointer-events:none;}
#boot .boot-stage{position:relative;width:min(30rem,78vw,66vh);aspect-ratio:1;}
#boot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
#boot svg *{transform-box:fill-box;transform-origin:center;}
#boot .boot-readout{margin-top:2rem;text-align:center;position:relative;}
#boot .boot-status{font-family:'JetBrains Mono',monospace;font-size:0.7rem;letter-spacing:0.28em;text-transform:uppercase;color:#4DFFD2;min-height:1em;}
#boot .boot-sub{font-family:'Ailerons',sans-serif;font-size:0.6rem;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#8A8FA8;margin-top:0.75rem;}
/* Centred with auto margins, not translateX(-50%): the timeline animates this
   element's y, anime.js owns the whole transform property, and its translateY
   replaced the centring translate on the first frame — which put the meter
   half its own width to the right for the entire boot. */
#boot .boot-meter{position:absolute;left:0;right:0;margin:0 auto;bottom:3.5rem;width:min(420px,60vw);}
#boot .boot-meter-rail{height:1px;background:rgba(255,255,255,0.10);position:relative;overflow:hidden;}
#boot .boot-meter-fill{position:absolute;inset:0;width:0%;background:#4DFFD2;box-shadow:0 0 8px rgba(77,255,210,0.6);}
#boot .boot-meter-row{display:flex;justify-content:space-between;align-items:center;margin-top:0.6rem;}
#boot .boot-meter-row span{font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.14em;color:#8A8FA8;text-transform:uppercase;}
#boot .boot-pct{color:#4DFFD2;font-variant-numeric:tabular-nums;}
#boot .boot-corner{position:absolute;font-family:'JetBrains Mono',monospace;font-size:0.58rem;letter-spacing:0.16em;text-transform:uppercase;color:rgba(138,143,168,0.55);}
#boot .tl{top:2rem;left:2rem;} #boot .tr{top:2rem;right:2rem;}
#boot .bl{bottom:2rem;left:2rem;} #boot .br{bottom:2rem;right:2rem;}
@media(max-width:640px){
  #boot .boot-corner{font-size:0.52rem;letter-spacing:0.1em;}
  #boot .tl,#boot .bl{left:1rem;} #boot .tr,#boot .br{right:1rem;}
}
</style>
