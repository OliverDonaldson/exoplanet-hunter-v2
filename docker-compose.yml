# Local stack: the serving API only. The console is one static file — build it
# with `make frontend`; there is nothing to containerise. Training is not a
# service either: it runs on demand (docker/train.Dockerfile) from the
# orchestrator.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/srv/models:ro
