# Vendored third-party source is kept byte-for-byte as upstream ships it, so
# `diff` against a new release shows only our documented patches. Formatting
# hooks must not touch it.
exclude: ^pipeline/vendor/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Vendored font licences are supplied text; reformatting a licence is
        # not ours to do.
        exclude: ^frontend/design-console/assets/fonts/.*LICENCE\.txt$
      - id: end-of-file-fixer
        exclude: ^frontend/design-console/assets/fonts/.*LICENCE\.txt$
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]  # data/model artefacts live in DVC/R2, not git
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: no-assistant-trailer
        name: no assistant co-author trailer
        entry: scripts-dev/reject-assistant-trailer.sh
        language: script
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        files: ^pipeline/src/
        additional_dependencies:
          - numpy>=1.26
          - pandas-stubs
          - types-tqdm
          - types-requests
