# Render Blueprint: deploys the vetting console as a static site.
#
# The console is `frontend/design-console`, built by `build.py` into one
# self-contained HTML file with fonts and anime.js inlined. The API contract it
# reads is `api/app/schemas.py`; the client that reads it is `src/app.api.js`.
#
# The API is NOT here — it runs on Fly (`exoplanet-hunter-api.fly.dev`),
# where suspend-when-idle machines snapshot RAM and keep the TensorFlow
# ensemble resident between requests. Render's 512 MB tiers OOM on model
# load, which is why the API never moved here.
#
# EH_API_BASE is baked into the built file as a meta tag. It must be the
# API's absolute origin: the console and the API are different origins, so a
# relative "/api" would resolve to this static site and 404. The API's
# FRONTEND_ORIGIN (fly.toml) must name this site back, for CORS.
#
# EH_CONSOLE_URL is this site's own origin, baked into og:url and og:image.
# Unfurlers reject relative image URLs, so the card cannot be linked any other
# way. If this service is ever renamed, this value moves with it or every
# shared link loses its preview.

services:
  - type: web
    name: exoplanet-hunter-console
    runtime: static
    # npm install provides animejs, which build.py inlines; python3 is present
    # in Render's build image.
    buildCommand: cd frontend && npm install && cd design-console && python3 build.py
    staticPublishPath: frontend/design-console/dist
    envVars:
      - key: EH_API_BASE
        value: https://exoplanet-hunter-api.fly.dev
      - key: EH_CONSOLE_URL
        value: https://exoplanet-hunter-console.onrender.com
